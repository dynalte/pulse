<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f1c" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Répondre — Pulse</title>
    <style>
      :root { color-scheme: dark; --bg: #070b14; --surface: #0f1727; --surface-2: #141f33; --border: rgba(255,255,255,.09); --text: #eef3fb; --muted: #8b9ab3; --accent: #12c2a0; --danger: #f2616a; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body { background: var(--bg); color: var(--text); font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; padding: 18px; }
      .card { width: min(480px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
      header { display: flex; align-items: center; gap: 11px; margin-bottom: 14px; }
      header img { width: 38px; height: 38px; }
      header strong { display: block; font-size: 16px; letter-spacing: -.02em; }
      header span { display: block; color: var(--muted); font-size: 12.5px; }
      textarea { width: 100%; min-height: 108px; resize: vertical; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 13px; padding: 12px 13px; font: inherit; font-size: 15px; line-height: 1.45; }
      textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(18,194,160,.15); }
      button { width: 100%; margin-top: 12px; height: 46px; border: none; border-radius: 13px; background: var(--accent); color: #041412; font: inherit; font-size: 14.5px; font-weight: 750; cursor: pointer; }
      button:disabled { opacity: .55; cursor: default; }
      .status { margin-top: 11px; font-size: 13px; color: var(--muted); min-height: 18px; text-align: center; }
      .status.error { color: var(--danger); }
      .status.ok { color: var(--accent); }
      .hint { margin: 12px 0 0; font-size: 11.5px; color: var(--muted); text-align: center; }
    </style>
  </head>
  <body>
    <main class="card">
      <header>
        <img src="logo.svg" alt="" />
        <div>
          <strong id="title">Réponse rapide</strong>
          <span>Votre message sera envoyé immédiatement.</span>
        </div>
      </header>
      <textarea id="body" placeholder="Écrire une réponse…" aria-label="Réponse" autofocus></textarea>
      <button type="button" id="send">Envoyer</button>
      <p class="status" id="status" role="status"></p>
      <p class="hint">Réponse rapide depuis une notification. Ouvrez Pulse pour retrouver la conversation complète.</p>
    </main>
    <script>
      (function () {
        const params = new URLSearchParams(location.hash.slice(1));
        const token = params.get('t') || '';
        const sender = params.get('n') || '';
        const bodyEl = document.getElementById('body');
        const sendEl = document.getElementById('send');
        const statusEl = document.getElementById('status');
        const titleEl = document.getElementById('title');
        const apiUrl = new URL('api-messagerie.php', location.origin + '/').href;
        let sending = false;

        if (sender) titleEl.textContent = 'Répondre à ' + sender;
        if (!token) {
          statusEl.textContent = 'Lien de réponse invalide. Ouvrez Pulse pour répondre.';
          statusEl.className = 'status error';
          sendEl.disabled = true;
          bodyEl.disabled = true;
          return;
        }

        function setStatus(text, kind) {
          statusEl.textContent = text;
          statusEl.className = 'status' + (kind ? ' ' + kind : '');
        }

        async function send() {
          const body = bodyEl.value.trim();
          if (!body || sending) return;
          sending = true;
          sendEl.disabled = true;
          setStatus('Envoi…');
          try {
            const res = await fetch(apiUrl + '?action=quick_reply', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ token, body }),
            });
            const data = await res.json().catch(() => null);
            if (!res.ok || !data || data.ok !== true) {
              throw new Error((data && data.error) || 'Envoi impossible.');
            }
            bodyEl.value = '';
            setStatus('Message envoyé ✓', 'ok');
            window.setTimeout(function () { window.close(); }, 900);
          } catch (e) {
            setStatus(e.message || 'Envoi impossible. Ouvrez Pulse pour réessayer.', 'error');
            sendEl.disabled = false;
          } finally {
            sending = false;
          }
        }

        sendEl.addEventListener('click', send);
        bodyEl.addEventListener('keydown', function (e) {
          if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            send();
          }
        });
        bodyEl.focus();
      })();
    </script>
  </body>
</html>
